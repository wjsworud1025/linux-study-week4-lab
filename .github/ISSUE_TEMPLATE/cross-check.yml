name: 팀원 교차 검증 결과
description: 짝의 저장소와 README로 검증한 실행 결과를 제출합니다.
title: "[4주차 교차 검증] "
labels: ["week4-cross-check"]
body:
  - type: dropdown
    id: verdict
    attributes:
      label: 판정
      description: README만 사용해 완료 기준을 모두 충족하면 성공을 선택합니다. 추가 도움을 받았거나 일부 단계만 완료했다면 일부 성공을 선택합니다.
      multiple: false
      options:
        - 성공
        - 일부 성공
        - 실패
    validations:
      required: true
  - type: input
    id: repository_url
    attributes:
      label: 검증 대상 저장소 URL
      description: 짝이 공유한 앱 저장소 주소를 입력합니다.
      placeholder: "https://github.com/owner/repository"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 검증 대상 커밋 SHA
      description: 실제로 체크아웃한 SHA를 입력합니다. 복제가 실패했다면 전달받은 대상 SHA를 입력합니다.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 검증 환경
      placeholder: "검증 날짜 · 운영체제 · Docker 및 Compose 버전"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 완료한 단계
      options:
        - label: 짝의 저장소를 지정된 커밋으로 준비하고 README로 서비스를 기동했다.
        - label: DB가 healthy이고 소개 페이지에 방문 번호가 표시됐다.
        - label: 웹 로그에서 해당 요청의 HTTP 200을 확인했다.
        - label: 재기동 후 DB 컨테이너 ID가 바뀌었다.
        - label: /visits에서 재기동 전 방문 번호를 확인했다.
        - label: 결과를 기록한 뒤 서비스를 종료했다.
  - type: textarea
    id: evidence
    attributes:
      label: 관찰값
      description: 실패한 경우 마지막 성공 단계와 오류를 적어 주세요. 암호와 .env 내용은 제외하세요.
      placeholder: |
        DB 상태와 웹 응답:
        요청 로그 한 줄:
        컨테이너 ID (교체 전 → 후):
        방문 번호 (교체 전 → 후):
    validations:
      required: true
  - type: dropdown
    id: assistance
    attributes:
      label: 독립 실행 여부
      options:
        - README만 사용
        - 추가 도움 사용
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: 막힌 단계와 개선 의견
      description: 마지막으로 성공한 단계와 오류를 적어 주세요. 암호와 .env 내용은 제외하세요.
